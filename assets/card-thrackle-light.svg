<text x="172" y="84" font-family="JetBrains Mono, Ubuntu Mono, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="20" fill="#7c3aed">2^(n-1) - n</text>
<text x="22" y="186" font-size="12" fill="#3b2a63">Every maximal convex thrackle on n vertices has exactly</text>
