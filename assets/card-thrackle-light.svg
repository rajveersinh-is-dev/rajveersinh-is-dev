<text x="175" y="48" font-weight="700" font-size="19" fill="#2e1065">Convex thrackles</text>
<text x="175" y="86" font-family="JetBrains Mono, Ubuntu Mono, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="22" fill="#7c3aed">2^(n-1) - n</text>
<text x="175" y="118" font-size="14" fill="#3b2a63">A maximal convex thrackle on n vertices has</text>
