<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #ffffff; margin: 0; padding: 24px; font-family: Ubuntu, Helvetica, Arial, sans-serif; }
  .card { border: 1px solid #d0d7de; border-radius: 8px; padding: 12px; margin-bottom: 18px; }
  h2 { font-size: 14px; color: #57606a; margin: 0 0 8px; font-weight: 600; }
  img { display: block; }
  .row { display: flex; gap: 12px; }
  .row img { width: 31%; }
</style>
</head>
<body>
<div class="card"><h2>banner-light</h2><img src="assets/banner-light.svg" width="100%"></div>
<div class="card"><h2>tagline-light</h2><img src="assets/tagline-light.svg" width="500"></div>
<div class="card"><h2>facts-light</h2><img src="assets/facts-light.svg" width="100%"></div>
<div class="card"><h2>seal-light</h2><img src="assets/seal-light.svg" width="430"></div>
<div class="card"><h2>cards-light</h2>
  <div class="row">
    <img src="assets/card-thrackle-light.svg">
    <img src="assets/card-logconcavity-light.svg">
    <img src="assets/card-packing-light.svg">
  </div>
</div>
<div class="card"><h2>map-light</h2><img src="assets/map-light.svg" width="100%"></div>
<div class="card"><h2>footer-light</h2><img src="assets/footer-light.svg" width="100%"></div>
</body>
</html>
