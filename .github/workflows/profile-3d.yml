name: GitHub-Profile-3D-Contrib

on: # every hour, at 0 minutes past the hour; also on push so a new commit
  # refreshes the graph right away instead of waiting for the next tick
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # two seasonal variants: dark text for light mode, light text for
          # dark mode. Both are generated with a transparent background.
          SETTING_JSON: .github/profile-3d-settings.json
      - name: Split into calendar, radar and language images
        run: |
          python3 .github/scripts/split-3d-svg.py profile-3d-contrib/profile-3d-light.svg light
          python3 .github/scripts/split-3d-svg.py profile-3d-contrib/profile-3d-dark.svg dark
          rm -f profile-3d-contrib/profile-3d-light.svg \
                profile-3d-contrib/profile-3d-dark.svg
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            git push
          fi
